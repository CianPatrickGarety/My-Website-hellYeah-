<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Snake Game</title>

        <style>
            body{
                background:#111;
                color:white;
                font-family: Arial, sans-serif;
                text-align: center;
            }

            canvas {
                background: #080808;
                border: 3px solid #36d66b;
                max-width: 95vw;
                height: auto;
            }

            button {
                padding:10px 22px;
                margin: 10px;
                cursor: pointer;
                font-size: 16px;
            }
        </style>
    </head>

    <body>
        <h1>SNAKE</h1>
        <p>Score: <span id="score">0</span></p>

        <canvas id="game" width="400" height="400"></canvas>

        <p id ="message">Press Start to play!</p>
        <button id="start">Start Game</button>
        <script>
            const canvas = document.getElementById("game");
            const ctx = canvas.getContext("2d");
            const scoreDisplay = document.getElementById("score");
            const message = document.getElementById("message");
            const startButton = document.getElementById("start");

            const cell = 20;
            const cells = canvas.width / cell;

            let snake, food, dx, dy, nextDx, nextDy;
            let score =0;
            let timer = null;
            let running = false;
            let gameStarted = false;

            function randomFood() {
                let position;

                do {
                    position = {
                        x: Math.floor(Math.random() * cells),
                        y: Math.floor(Math.random() * cells),
                    };
                } while (snake.some(part =>
                    part.x === position.x && part.y === position.y
                ));

                return position;

            }
            
            function resetGame() {
                snake = [
                    {x:10, y:10},
                    {x:9, y:10},
                    {x:8, y:10}
                ];

                dx=1;
                dy=0;
                nextDx=1;
                nextDy=0;

                score=0;
                scoreDisplay.textContent=score;
                food=randomFood();

                draw();
            }

            function draw() {
                ctx.fillStyle="#080808";
                ctx.fillRect(0,0, canvas.width, canvas.height);

                // Draw grid
                ctx.strokeStyle ="#202020";
                ctx.lineWidth=1;

                for(let i =0; i <= canvas.width; i+=cell) {
                    ctx.beginPath()
                    ctx.moveTo(i,0)
                    ctx.lineTo(i, canvas.height);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(0,i)
                    ctx.lineTo(canvas.width, i);
                    ctx.stroke();        
                }

                // Draw food
                ctx.fillStyle ="#ff4040";
                ctx.fillRect(
                    food.x * cell +2,
                    food.y * cell +2,
                    cell - 4,
                    cell -4
                );

                // Draw snake
                snake.forEach((part, index) => {
                    ctx.fillStyle=index === 0 ? "#a3ffb0" : "#36d66b";

                    ctx.fillRect(
                        part.x * cell + 1,
                        part.y * cell + 1,
                        cell - 2,
                        cell -2
                    );
                });
            }

            function gameOver() {
                clearInterval(timer);
                timer = null;
                running = false;

                message.textContent = "Game over! Final score: " + score;
                startButton.textContent = "Play Again";
            }

            function update() {
                dx = nextDx;
                dy = nextDy;

                const head ={
                    x: snake[0].x + dx,
                    y: snake[0].y + dy
                };
                const eating = head.x === food.x && head.y === food.y;

                //Wall collision
                if (
                    head.x < 0 || head.x>= cells ||
                    head.y < 0 || head.y >=cells
                ) {
                    gameOver();
                    return;
                }

                //Body collision
                const body = eating ? snake : snake.slice(0, -1);

                if (body.some(part =>
                    part.x === head.x && part.y === head.y
                )) {
                    gameOver();
                    return;
                }
                
                snake.unshift(head);

                if (eating) {
                    score += 10;
                    scoreDisplay.textContent = score;
                    food = randomFood();
                } else {
                    snake.pop();
                }

                draw();

            }

            function startGame() {
                clearInterval(timer);
                resetGame();

                running = true;
                gameStarted = true;

                message.textContent = "Use the arrows keys to move!";
                startButton.textContent = "Restart";

                timer = setInterval(update, 110);
            }

            document.addEventListener("keydown", event => {
                const key = event.key.toLowerCase();

                //Stop arrow keys scrolling the page
                if (key.startsWith("arrow")) {
                    event.preventDefault();
                }

                if (!running) return;

                // Up :W or Arrow Up
                if ((key ==="w" || key ==="arrowup") && dy !==1) {
                    nextDx = 0;
                    nextDy = -1;
                }
                // Down: S or Arrow Down
                else if ((key ==="s" || key ==="arrowdown") && dy !==-1) {
                    nextDx = 0;
                    nextDy = 1;
                }
                // Down: A or Arrow Left
                else if ((key ==="a" || key ==="arrowleft") && dy !==1) {
                    nextDx = -1;
                    nextDy = 0;
                }
                // Down: D or Arrow Right
                else if ((key ==="d" || key ==="arrowright") && dy !==-1) {
                    nextDx = 1;
                    nextDy = 0;
                }
            });


                
            startButton.addEventListener("click", startGame);

            resetGame();
        </script>
    </body>
</html>
